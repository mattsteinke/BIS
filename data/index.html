<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>BIS V13 UI Mockup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<h2>BIS V14 composer</h2>

<!-- ===================================================== -->
<!-- BANKS & TRANSPORT -->
<!-- ===================================================== -->

<section class="panel">

  <div class="panel-header">
    <strong>BANKS & TRANSPORT</strong>
  </div>

  <div class="panel-body">

    <div class="bank-section">

      <div class="bank-column">
        <div class="bank-row" id="bankgrid"></div>
        <div class="bank-row"></div>
      </div>

      <div class="transport-column">

        <button
          class="default"
          id="playBtn"
          onclick="s('PLAY')">
          PLAY
        </button>

        <button
          class="default"
          onclick="s('STOP')">
          STOP
        </button>

      </div>

      <div class="transport-column">

        <button
          class="record"
          id="recordBtn"
          onclick="s('RECORD')">
          RECORD
        </button>

        <button
          class="overwrite"
          id="overwriteBtn"
          onclick="s('OVERWRITE')">
          OVERWRITE
        </button>

      </div>
    </div>

  </div>

</section>

<!-- ===================================================== -->
<!-- PARAMETERS -->
<!-- ===================================================== -->

<section class="panel">

  <div class="panel-header">
    <strong>PARAMETERS</strong>
  </div>

  <div class="panel-body">

    <div class="parameter-grid">

      <!-- BPM / CCB -->

      <div class="parameter-cell">

        <div class="parameter-row">

          <span class="parameter-name">BPM</span>

          <input
            id="bpm"
            type="range"
            min="20"
            max="240"
            value="120"
            oninput="bpmv.textContent=this.value">

          <span id="bpmv" class="parameter-value">
            120
          </span>

        </div>

      </div>

      <div class="parameter-cell future-param">

        <div class="parameter-row">

          <span class="parameter-name">CCB</span>

          <input type="range" disabled>

          <span class="parameter-value">
            0
          </span>

        </div>

      </div>

      <!-- ONTIME / CCC -->

      <div class="parameter-cell">

        <div class="parameter-row">

          <span class="parameter-name">ONTIME</span>

          <input
            id="ont"
            type="range"
            min="10"
            max="1000"
            value="50"
            oninput="ontv.textContent=this.value">

          <span id="ontv" class="parameter-value">
            50
          </span>

        </div>

      </div>

      <div class="parameter-cell future-param">

        <div class="parameter-row">

          <span class="parameter-name">CCC</span>

          <input type="range" disabled>

          <span class="parameter-value">
            0
          </span>

        </div>

      </div>

      <!-- DRUNK / CCD -->

      <div class="parameter-cell">

        <div class="parameter-row">

          <span class="parameter-name">DRUNK</span>

          <input
            id="dr"
            type="range"
            min="0"
            max="100"
            value="0"
            oninput="drv.textContent=this.value">

          <span id="drv" class="parameter-value">
            0
          </span>

        </div>

      </div>

      <div class="parameter-cell future-param">

        <div class="parameter-row">

          <span class="parameter-name">CCD</span>

          <input type="range" disabled>

          <span class="parameter-value">
            0
          </span>

        </div>

      </div>

      <!-- PROB / CCE -->

      <div class="parameter-cell">

        <div class="parameter-row">

          <span class="parameter-name">PROB</span>

          <input
            id="pr"
            type="range"
            min="0"
            max="100"
            value="100"
            oninput="prv.textContent=this.value">

          <span id="prv" class="parameter-value">
            100
          </span>

        </div>

      </div>

      <div class="parameter-cell future-param">

        <div class="parameter-row">

          <span class="parameter-name">CCE</span>

          <input type="range" disabled>

          <span class="parameter-value">
            0
          </span>

        </div>

      </div>

      <!-- STEPS / CCF -->

      <div class="parameter-cell">

        <div class="parameter-row">

          <span class="parameter-name">STEPS</span>

          <input
            id="st"
            type="range"
            min="1"
            max="25"
            value="25">

          <span id="stv" class="parameter-value">
            25
          </span>

        </div>

      </div>

      <div class="parameter-cell future-param">

        <div class="parameter-row">

          <span class="parameter-name">CCF</span>

          <input type="range" disabled>

          <span class="parameter-value">
            0
          </span>

        </div>

      </div>

      <!-- SCRUB / CCG -->

      <div class="parameter-cell">

        <div class="parameter-row">

          <span class="parameter-name">SCRUB</span>

          <input
            id="sc"
            type="range"
            min="0"
            max="24"
            value="0">

          <span id="scv" class="parameter-value">
            0
          </span>

        </div>

      </div>

      <div class="parameter-cell future-param">

        <div class="parameter-row">

          <span class="parameter-name">CCG</span>

          <input type="range" disabled>

          <span class="parameter-value">
            0
          </span>

        </div>

      </div>

      <!-- CCA / CCH -->

      <div class="parameter-cell future-param">

        <div class="parameter-row">

          <span class="parameter-name">CCA</span>

          <input type="range" disabled>

          <span class="parameter-value">
            0
          </span>

        </div>

      </div>

      <div class="parameter-cell future-param">

        <div class="parameter-row">

          <span class="parameter-name">CCH</span>

          <input type="range" disabled>

          <span class="parameter-value">
            0
          </span>

        </div>

      </div>

    </div>

  </div>

</section>


<!-- ===================================================== -->
<!-- SEQUENCER -->
<!-- ===================================================== -->

<section class="panel">

  <div class="panel-header">

    <strong>SEQUENCER</strong>

    <button
      class="module-action"
      id="clearGridBtn">

      RESET

    </button>

  </div>

  <div class="panel-body">

    <div id="g"></div>

  </div>

</section>

<!-- ===================================================== -->
<!-- METER -->
<!-- ===================================================== -->

<section class="panel">

  <div class="panel-header">
    <strong>METER</strong>
  </div>

  <div class="panel-body">

    <div class="meter-row">

      <span class="meter-label">
        OUTPUTS
      </span>

      <div id="outs"></div>

      <div class="midi-status">
        <span>MIDI</span>
        <div
          id="midiLed"
          class="midi-led">
        </div>
      </div>

    </div>

  </div>

</section>

<!-- ===================================================== -->
<!-- CONSOLE -->
<!-- ===================================================== -->

<section class="panel">

  <div class="panel-header">
    <strong>CONSOLE</strong>
  </div>

  <div class="panel-body">

    <textarea
      id="console"
      readonly>
    </textarea>

  </div>

</section>

<script src="app.js"></script>
</div>
</body>
</html>
